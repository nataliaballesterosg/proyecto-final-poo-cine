spring.application.name=cine-api
server.port=8080

# Conexion a PostgreSQL (se sobreescribe con variables de entorno
# en docker-compose.yml y en los manifiestos de Kubernetes)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cine}
spring.datasource.username=${DB_USUARIO:cine}
spring.datasource.password=${DB_CLAVE:cine}
spring.datasource.hikari.maximum-pool-size=${DB_POOL:10}

# El esquema y los datos los crea db/init.sql; Hibernate solo valida que coincidan
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Salud (liveness / readiness) para Docker y Kubernetes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Log mas limpio durante las pruebas de carga
logging.level.root=WARN
logging.level.com.proyecto=INFO
