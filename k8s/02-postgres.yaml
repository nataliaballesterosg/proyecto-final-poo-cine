# =====================================================================
# Base de datos PostgreSQL: 1 sola replica (no se escala en este proyecto).
# Se fija al nodo etiquetado "rol=base-datos" (el nodo master) para que,
# al agregar nodos, la BD no cambie de sitio y las pruebas sean comparables.
# =====================================================================

# Disco persistente (K3s trae el aprovisionador "local-path")
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: datos-postgres
  namespace: cine
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: basedatos
  namespace: cine
spec:
  replicas: 1
  strategy:
    type: Recreate            # nunca dos PostgreSQL sobre el mismo disco
  selector:
    matchLabels:
      app: basedatos
  template:
    metadata:
      labels:
        app: basedatos
    spec:
      nodeSelector:
        rol: base-datos
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: credenciales-db
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U cine -d cine"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: datos
              mountPath: /var/lib/postgresql/data
            - name: script-inicial
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: datos
          persistentVolumeClaim:
            claimName: datos-postgres
        - name: script-inicial
          configMap:
            name: db-init          # creado desde db/init.sql por desplegar.sh
---
# Nombre DNS interno "basedatos" -> la API se conecta a basedatos:5432
apiVersion: v1
kind: Service
metadata:
  name: basedatos
  namespace: cine
spec:
  selector:
    app: basedatos
  ports:
    - port: 5432
      targetPort: 5432
